# Copy to /etc/fermentd/secrets.yaml on the Pi (mode 600, owner fermentd).
# Device id and local key come from `python -m tinytuya wizard`.
# The IP and protocol version live in fermentd.yaml, not here.
tuya:
  teckin_mat:
    device_id: "replace-with-device-id"
    local_key: "replace-with-local-key"

# Uncomment to send action and critical alerts, and the weekly digest, to a phone.
# Install the ntfy app and subscribe to this topic. The topic name is the secret.
# ntfy:
#   topic: "replace-with-a-long-random-topic"
#   server: "https://ntfy.sh"

# Dashboard login (recommended). Writes need a password or token once this is set.
# Set the password with `fermentd-ctl --config config/fermentd.yaml set-password`,
# which writes the scrypt hash here. Never put the plain password in this file.
# web:
#   password_hash: "scrypt$16384$8$1$..."
#   token: "optional-long-random-token-for-scripts"   # Authorization: Bearer <token>
