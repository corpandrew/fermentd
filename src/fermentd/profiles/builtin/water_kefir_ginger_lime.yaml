id: water_kefir_ginger_lime
name: Water kefir, ginger-lime
extends: null
status: supported
requires_capability:
- heat
tracking_mode: timer
category: water_kefir
vessel_types:
- jar
- jug
recipe: docs/recipes/water_kefir_ginger_lime.md
default_stage: f1
temperature:
  default_target_f: 74
  recommended_f:
  - 70
  - 75
  allowed_target_f:
  - 68
  - 75
  default_hysteresis_f: 1.0
done_rule:
  type: timer
stages:
- id: f1
  core: primary
  tracking: timer
- id: bottle
  core: packaging
- id: in_bottle
  core: conditioning
  tracking: timer
- id: refrigerated
  core: done
reminders:
- id: taste
  at: stage:f1+24h
  repeat: 12h
  text: Taste the water kefir. Strain out the grains when it is only lightly sweet, usually 24-48 hours. Do not go past 72 hours.
- id: squeeze
  at: stage:in_bottle+18h
  repeat: 6h
  text: Squeeze the plastic tester bottle. Move every bottle to the fridge when it is firm to rock hard.
- id: refrigerate_now
  at: stage:in_bottle+48h
  repeat: 6h
  text: If the tester is hard, move all bottles to the fridge now. Do not leave fruit-flavored glass bottles warm.
- id: finish
  at: stage:refrigerated+7d
  text: Drink the water kefir within the next week or so.
guidance:
  headspace: Leave 1-2 inches of headspace in each bottle.
  blowoff: The first ferment (F1) is an open ferment under a tight cloth, not an airlock.
  sampling: Taste with a clean straw. Squeeze the plastic tester bottle; do not open glass to check pressure.
  safety_glass: Flavored second ferments carbonate fast. Never leave the bottles warm once the plastic tester is hard.
  safety_pitch: Add the culture only when the liquid is below 80 F.
  note: Water kefir likes 68-78 F. fermentd holds 74 F (its cap is 75 F), so it works all winter; the first ferment takes about 24-48 hours.
alerts:
  pressure_risk_margin_f: 3
  warm_action_f: 79
  over_target_margin_f: 3
safety:
  cutoff_f: 80
carbonation:
  default: sparkling
  target_vol: 0
  max_vol: 3.0
  method: in_bottle
