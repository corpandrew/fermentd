id: ginger_beer_jamaican
name: Ginger beer, spicy Jamaican
extends: null
status: supported
requires_capability:
- heat
tracking_mode: timer
category: soda
vessel_types:
- jug
- bottle_group
recipe: docs/recipes/ginger_beer_jamaican.md
default_stage: in_bottle
temperature:
  default_target_f: 72
  recommended_f:
  - 68
  - 75
  allowed_target_f:
  - 68
  - 75
  default_hysteresis_f: 1.0
done_rule:
  type: timer
stages:
- id: bottle
  core: packaging
- id: in_bottle
  core: conditioning
  tracking: timer
- id: refrigerated
  core: done
reminders:
- id: squeeze
  at: stage:in_bottle+12h
  repeat: 12h
  text: Squeeze the plastic tester bottle. Twice a day until it is rock hard.
- id: refrigerate_now
  at: stage:in_bottle+24h
  repeat: 6h
  text: If the plastic tester is rock hard, move every bottle to the fridge now. Do not leave glass warm.
- id: open
  at: stage:refrigerated+24h
  text: Chill is done. Open the first bottle slowly over the sink.
- id: finish
  at: stage:refrigerated+14d
  text: Drink the ginger beer within the next week. Yeast keeps working slowly even cold.
guidance:
  headspace: Leave 1-2 inches of headspace in each bottle.
  blowoff: Not used. Mix in the jug and bottle on day 0.
  sampling: Squeeze the plastic tester bottle. Do not open a glass bottle to check pressure.
  safety_glass: Glass bottles can burst if over-carbonated. Never leave them warm once the tester is rock hard.
  safety_pitch: Wait until the liquid is below 80 F before adding yeast.
  note: These like warmth. The heat mat holds the target even in a cold winter room, so they work well all year. fermentd caps every target at 75 F.
alerts:
  pressure_risk_margin_f: 3
  warm_action_f: 75
  over_target_margin_f: 2
safety:
  cutoff_f: 80
carbonation:
  default: sparkling
  target_vol: 0
  max_vol: 3.0
  method: in_bottle
